<div class="container py-4">
   <div class="card shadow border-0 rounded-4 mx-auto" style="max-width: 650px;">
      <div class="card-header text-white text-center rounded-top-4"
         style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">
         <h2 class="mb-0 fw-bold" *ngIf="!form.data.id"><i class="bi bi-person-plus me-2"></i>Add Food Delivery</h2>
         <h2 class="mb-0 fw-bold" *ngIf="form.data.id > 0"><i class="bi bi-pencil-square me-2"></i>Update Food Delivery</h2>
      </div>
      <div class="card-body p-4">

         <div class="alert alert-success text-center" *ngIf="!form.error && form.message"><i
               class="bi bi-check-circle me-2"></i>{{ form.message }}</div>
         <div class="alert alert-danger text-center" *ngIf="form.error && form.message"><i
               class="bi bi-exclamation-triangle me-2"></i>{{ form.message }}</div>


         <div class="mb-3"><label class="form-label fw-bold">Customer Name <span class="text-danger">*</span></label>
            <input
               type="text" name="customerName" class="form-control" [(ngModel)]="form.data.customerName"
               placeholder="Enter Customer Name">
            <div class="text-danger small mt-1" *ngIf="form.inputerror.customerName">{{ form.inputerror.customerName }}</div>
         </div>
         <div class="mb-3"><label class="form-label fw-bold">Restaurant <span class="text-danger">*</span></label>
            <input
               type="text" name="restaurant" class="form-control" [(ngModel)]="form.data.restaurant"
               placeholder="Enter Restaurant">

            <div class="text-danger small mt-1" *ngIf="form.inputerror.restaurant">{{ form.inputerror.restaurant }}</div>
         </div>
         
         <div class="mb-3"><label class="form-label fw-bold">Order Amount <span class="text-danger">*</span></label>
            <input
               type="text" name="orderAmount" class="form-control" [(ngModel)]="form.data.orderAmount" placeholder="Enter Order Amount">
            <div class="text-danger small mt-1" *ngIf="form.inputerror.orderAmount">{{ form.inputerror.orderAmount }}</div>
         </div>
         <div class="mb-3"><label class="form-label fw-bold">Delivery Status <span
                  class="text-danger">*</span></label>
            <input type="text" name="deliveryStatus" class="form-control"
               [(ngModel)]="form.data.deliveryStatus" placeholder="Enter Delivery Status">
            <div class="text-danger small mt-1" *ngIf="form.inputerror.deliveryStatus">{{ form.inputerror.deliveryStatus }}</div>
         </div>

         <div class="text-center">
            <button type="button" class="btn btn-primary px-4 me-2" (click)="submit()"><i class="bi bi-save me-2"></i>{{
               (isEditMode() ? 'Buttons.Update' : 'Buttons.Save') | translate }}</button>
            <button type="button" class="btn btn-outline-primary px-4" (click)="forward('/fooddeliverylist')"><i
                  class="bi bi-list-ul me-2"></i>{{ 'Buttons.List' | translate }}</button>
         </div>
      </div>
   </div>
</div>
<app-footer></app-footer>
