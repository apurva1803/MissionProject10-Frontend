

<div class="container py-4">
    <div class="card shadow border-0 rounded-4 mx-auto" style="max-width: 650px;">
        <div class="card-header text-white text-center rounded-top-4" style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">
            <h2 class="mb-0 fw-bold" *ngIf="!form.data.id"><i class="bi bi-clipboard-plus me-2"></i>Add Marksheet</h2>
            <h2 class="mb-0 fw-bold" *ngIf="form.data.id > 0"><i class="bi bi-pencil-square me-2"></i>Update Marksheet</h2>
        </div>
        <div class="card-body p-4">
            <div class="alert alert-success text-center" *ngIf="!form.error && form.message"><i class="bi bi-check-circle me-2"></i>{{ form.message }}</div>
            <div class="alert alert-danger text-center" *ngIf="form.error && form.message"><i class="bi bi-exclamation-triangle me-2"></i>{{ form.message }}</div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'RollNO' | translate }} <span class="text-danger">*</span></label><input type="text" name="rollNo" class="form-control" [(ngModel)]="form.data.rollNo" maxlength="5" placeholder="{{ 'RollNO' | translate }}"><div class="text-danger small mt-1" *ngIf="form.inputerror.rollNo">{{ form.inputerror.rollNo }}</div></div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'Name' | translate }} <span class="text-danger">*</span></label><select name="studentId" class="form-select" [compareWith]="compareStudentIds" [(ngModel)]="form.data.studentId"><option [ngValue]="undefined">------------ Select ------------</option><option *ngFor="let obj of form.preload.studentList" [ngValue]="obj.key">{{ obj.value }}</option></select><div class="text-danger small mt-1" *ngIf="form.inputerror.studentId">{{ form.inputerror.studentId }}</div></div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'Physics' | translate }} <span class="text-danger">*</span></label><input type="text" name="physics" class="form-control" [(ngModel)]="form.data.physics" maxlength="3" placeholder="{{ 'Physics' | translate }}"><div class="text-danger small mt-1" *ngIf="form.inputerror.physics">{{ form.inputerror.physics }}</div></div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'Chemistry' | translate }} <span class="text-danger">*</span></label><input type="text" name="chemistry" class="form-control" [(ngModel)]="form.data.chemistry" maxlength="3" placeholder="{{ 'Chemistry' | translate }}"><div class="text-danger small mt-1" *ngIf="form.inputerror.chemistry">{{ form.inputerror.chemistry }}</div></div>
            <div class="mb-4"><label class="form-label fw-bold">{{ 'Maths' | translate }} <span class="text-danger">*</span></label><input type="text" name="maths" class="form-control" [(ngModel)]="form.data.maths" maxlength="3" placeholder="{{ 'Maths' | translate }}"><div class="text-danger small mt-1" *ngIf="form.inputerror.maths">{{ form.inputerror.maths }}</div></div>
            <div class="text-center">
                <button type="button" class="btn btn-primary px-4 me-2" (click)="submit()"><i class="bi bi-save me-2"></i>{{ (isEditMode() ? 'Buttons.Update' : 'Buttons.Save') | translate }}</button>
                <button type="button" class="btn btn-outline-primary px-4" (click)="forward('/marksheetlist')"><i class="bi bi-list-ul me-2"></i>{{ 'Buttons.List' | translate }}</button>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
