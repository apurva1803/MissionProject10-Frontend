<div class="container py-4">
   <div class="card shadow border-0 rounded-4 mx-auto" style="max-width: 650px;">
      <div class="card-header text-white text-center rounded-top-4"
         style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">
         <h2 class="mb-0 fw-bold" *ngIf="!form.data.id"><i class="bi bi-person-plus me-2"></i>Add Online Voting</h2>
         <h2 class="mb-0 fw-bold" *ngIf="form.data.id > 0"><i class="bi bi-pencil-square me-2"></i>Update Online Voting</h2>
      </div>
      <div class="card-body p-4">
         <div class="alert alert-success text-center" *ngIf="!form.error && form.message"><i
               class="bi bi-check-circle me-2"></i>{{ form.message }}</div>
         <div class="alert alert-danger text-center" *ngIf="form.error && form.message"><i
               class="bi bi-exclamation-triangle me-2"></i>{{ form.message }}</div>

         <div class="mb-3"><label class="form-label fw-bold">Name <span class="text-danger">*</span></label><input
               type="text" name="name" class="form-control" [(ngModel)]="form.data.name"
               placeholder="Enter Name">
            <div class="text-danger small mt-1" *ngIf="form.inputerror.name">{{ form.inputerror.name }}</div>
         </div>
         <div class="mb-3"><label class="form-label fw-bold">Age <span class="text-danger">*</span></label><input
               type="text" name="age" class="form-control" [(ngModel)]="form.data.age"
               placeholder="Enter Age">
            <div class="text-danger small mt-1" *ngIf="form.inputerror.age">{{ form.inputerror.age }}</div>
         </div>
         <div class="mb-3"><label class="form-label fw-bold">Constituency <span class="text-danger">*</span></label><input
               type="text" name="constituency" class="form-control" [(ngModel)]="form.data.constituency" placeholder="Enter Constituency">
            <div class="text-danger small mt-1" *ngIf="form.inputerror.constituency">{{ form.inputerror.constituency }}</div>
         </div>
         <div class="mb-3">
            <label for="hasVoted" class="form-label fw-bold">Has Voted <span class="text-danger">*</span></label>
            <select id="hasVoted" name="hasVoted" class="form-select" [(ngModel)]="form.data.hasVoted">
               <option [ngValue]="null" disabled>Select voting status</option>
               <option [ngValue]="true">Yes</option>
               <option [ngValue]="false">No</option>
            </select>
            <div class="text-danger small mt-1" *ngIf="form.inputerror.hasVoted">{{ form.inputerror.hasVoted }}</div>
         </div>

         <div class="text-center">
            <button type="button" class="btn btn-primary px-4 me-2" (click)="submit()"><i class="bi bi-save me-2"></i>{{
               (isEditMode() ? 'Buttons.Update' : 'Buttons.Save') | translate }}</button>
            <button type="button" class="btn btn-outline-primary px-4" (click)="forward('/onlinevotinglist')"><i
                  class="bi bi-list-ul me-2"></i>{{ 'Buttons.List' | translate }}</button>
         </div>
      </div>
   </div>
</div>
<app-footer></app-footer>
