<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center text-primary fw-bold mb-4">Forget Password</h2>

                    <div class="text-center mb-4" style="min-height: 24px;">
                        <div class="fw-semibold text-success" *ngIf="!form.error && form.message">{{ form.message }}</div>
                        <div class="fw-semibold text-danger" *ngIf="form.error && form.message">{{ form.message }}</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            {{ 'UserForm.LoginId' | translate }} <span class="text-danger">*</span>
                        </label>

                        <div class="input-group">
                            <input type="text"
                                   class="form-control"
                                   name="loginId"
                                   [(ngModel)]="form.data.loginId"
                                   placeholder="Enter Login ID">
                            <button class="btn btn-primary" type="button" (click)="submit()">
                                Go
                            </button>
                        </div>

                        <div class="text-danger small mt-2" *ngIf="form.inputerror.loginId">
                            {{ form.inputerror.loginId }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-footer></app-footer>
