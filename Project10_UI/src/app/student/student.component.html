

<div class="container py-4">
    <div class="card shadow border-0 rounded-4 mx-auto" style="max-width: 650px;">
        <div class="card-header text-white text-center rounded-top-4" style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">
            <h2 class="mb-0 fw-bold" *ngIf="!form.data.id"><i class="bi bi-person-plus me-2"></i>Add Student</h2>
            <h2 class="mb-0 fw-bold" *ngIf="form.data.id > 0"><i class="bi bi-pencil-square me-2"></i>Update Student</h2>
        </div>
        <div class="card-body p-4">
            <div class="alert alert-success text-center" *ngIf="!form.error && form.message"><i class="bi bi-check-circle me-2"></i>{{ form.message }}</div>
            <div class="alert alert-danger text-center" *ngIf="form.error && form.message"><i class="bi bi-exclamation-triangle me-2"></i>{{ form.message }}</div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'EnrolNo.' | translate }} <span class="text-danger">*</span></label><input type="text" name="enrolNo" class="form-control" [(ngModel)]="form.data.enrolNo" placeholder="{{ 'EnrolNo.' | translate }}"><div class="text-danger small mt-1" *ngIf="form.inputerror.enrolNo">{{ form.inputerror.enrolNo }}</div></div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'UserForm.FirstName' | translate }} <span class="text-danger">*</span></label><input type="text" name="firstName" class="form-control" [(ngModel)]="form.data.firstName" placeholder="Enter First Name"><div class="text-danger small mt-1" *ngIf="form.inputerror.firstName">{{ form.inputerror.firstName }}</div></div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'UserForm.LastName' | translate }} <span class="text-danger">*</span></label><input type="text" name="lastName" class="form-control" [(ngModel)]="form.data.lastName" placeholder="Enter Last Name"><div class="text-danger small mt-1" *ngIf="form.inputerror.lastName">{{ form.inputerror.lastName }}</div></div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'EmailId' | translate }} <span class="text-danger">*</span></label><input type="text" name="email" class="form-control" [(ngModel)]="form.data.email" placeholder="Enter Email ID"><div class="text-danger small mt-1" *ngIf="form.inputerror.email">{{ form.inputerror.email }}</div></div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'UserForm.DateOfBirth' | translate }} <span class="text-danger">*</span></label><input type="date" name="dob" class="form-control" [ngModel]="form.data.dob | date:'yyyy-MM-dd'" (ngModelChange)="form.data.dob = $event"><div class="text-danger small mt-1" *ngIf="form.inputerror.dob">{{ form.inputerror.dob }}</div></div>
            <div class="mb-3"><label class="form-label fw-bold">{{ 'College' | translate }} <span class="text-danger">*</span></label><select name="collegeId" class="form-select" [compareWith]="compareCollegeIds" [(ngModel)]="form.data.collegeId"><option [ngValue]="undefined">------------ Select ------------</option><option *ngFor="let obj of form.preload.collegeList" [ngValue]="obj.key">{{ obj.value }}</option></select><div class="text-danger small mt-1" *ngIf="form.inputerror.collegeId">{{ form.inputerror.collegeId }}</div></div>
            <div class="mb-4"><label class="form-label fw-bold">{{ 'UserForm.Mobile' | translate }} <span class="text-danger">*</span></label><input type="text" name="phoneNo" class="form-control" [(ngModel)]="form.data.phoneNo" maxlength="10" placeholder="Enter Mobile No."><div class="text-danger small mt-1" *ngIf="form.inputerror.phoneNo">{{ form.inputerror.phoneNo }}</div></div>
            <div class="text-center">
                <button type="button" class="btn btn-primary px-4 me-2" (click)="submit()"><i class="bi bi-save me-2"></i>{{ (isEditMode() ? 'Buttons.Update' : 'Buttons.Save') | translate }}</button>
                <button type="button" class="btn btn-outline-primary px-4" (click)="forward('/studentlist')"><i class="bi bi-list-ul me-2"></i>{{ 'Buttons.List' | translate }}</button>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
