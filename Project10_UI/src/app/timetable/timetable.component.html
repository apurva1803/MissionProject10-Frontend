<div class="container py-4">
   <div class="card shadow border-0 rounded-4 mx-auto" style="max-width: 650px;">
      <div class="card-header text-white text-center rounded-top-4" style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">
         <h2 class="mb-0 fw-bold" *ngIf="!form.data.id"><i class="bi bi-calendar-plus me-2"></i>Add Timetable</h2>
         <h2 class="mb-0 fw-bold" *ngIf="form.data.id > 0"><i class="bi bi-pencil-square me-2"></i>Update Timetable</h2>
      </div>
      <div class="card-body p-4">
         <div class="alert alert-success text-center" *ngIf="!form.error && form.message"><i class="bi bi-check-circle me-2"></i>{{ form.message }}</div>
         <div class="alert alert-danger text-center" *ngIf="form.error && form.message"><i class="bi bi-exclamation-triangle me-2"></i>{{ form.message }}</div>
         <div class="mb-3"><label class="form-label fw-bold">{{'Course'} | translate }  <span class="text-danger">*</span></label><select name="courseId" class="form-select" [compareWith]="compareCourseIds" [(ngModel)]="form.data.courseId"><option [ngValue]="undefined">------------ Select ------------</option><option *ngFor="let obj of form.preload.courseList" [ngValue]="obj.key">{{ obj.value }}</option></select><div class="text-danger small mt-1" *ngIf="form.inputerror.courseId">{{ form.inputerror.courseId }}</div></div>
         <div class="mb-3"><label class="form-label fw-bold">{{ 'Subject' | translate }} <span class="text-danger">*</span></label><select name="subjectId" class="form-select" [compareWith]="compareSubjectIds" [(ngModel)]="form.data.subjectId"><option [ngValue]="undefined">------------ Select ------------</option><option *ngFor="let obj of form.preload.subjectList" [ngValue]="obj.key">{{ obj.value }}</option></select><div class="text-danger small mt-1" *ngIf="form.inputerror.subjectId">{{ form.inputerror.subjectId }}</div></div>
         <div class="mb-3"><label class="form-label fw-bold">{{'Semester' | translate}} <span class="text-danger">*</span></label><select name="semester" class="form-select" [compareWith]="compareSemesters" [(ngModel)]="form.data.semester"><option [ngValue]="undefined">------------ Select ------------</option><option [ngValue]="1">1</option><option [ngValue]="2">2</option><option [ngValue]="3">3</option><option [ngValue]="4">4</option><option [ngValue]="5">5</option><option [ngValue]="6">6</option><option [ngValue]="7">7</option><option [ngValue]="8">8</option></select><div class="text-danger small mt-1" *ngIf="form.inputerror.semester">{{ form.inputerror.semester }}</div></div>
         <div class="mb-3"><label class="form-label fw-bold">{{'ExamDate' | translate}} <span class="text-danger">*</span></label><input type="date" name="examDate" class="form-control" [ngModel]="form.data.examDate | date:'yyyy-MM-dd'" (ngModelChange)="form.data.examDate = $event"><div class="text-danger small mt-1" *ngIf="form.inputerror.examDate">{{ form.inputerror.examDate }}</div></div>
         <div class="mb-3"><label class="form-label fw-bold">{{'ExamTime' | translate}} <span class="text-danger">*</span></label><select name="examTime" class="form-select" [(ngModel)]="form.data.examTime"><option [ngValue]="undefined">------------ Select ------------</option><option value="08:00 AM to 11:00 AM">08:00 AM to 11:00 AM</option><option value="12:00 PM to 03:00 PM">12:00 PM to 03:00 PM</option><option value="04:00 PM to 07:00 PM">04:00 PM to 07:00 PM</option></select><div class="text-danger small mt-1" *ngIf="form.inputerror.examTime">{{ form.inputerror.examTime }}</div></div>
         <div class="mb-4"><label class="form-label fw-bold">{{ 'Description' | translate }} <span class="text-danger">*</span></label><textarea name="description" class="form-control" [(ngModel)]="form.data.description" rows="4" placeholder="Enter Short Description" style="resize: none;"></textarea><div class="text-danger small mt-1" *ngIf="form.inputerror.description">{{ form.inputerror.description }}</div></div>
         <div class="text-center">
            <button type="button" class="btn btn-primary px-4 me-2" (click)="submit()"><i class="bi bi-save me-2"></i>{{ (isEditMode() ? 'Buttons.Update' : 'Buttons.Save') | translate }}</button>
            <button type="button" class="btn btn-outline-primary px-4" (click)="forward('/timetablelist')"><i class="bi bi-list-ul me-2"></i>{{ 'Buttons.List' | translate }}</button>
         </div>
      </div>
   </div>
</div>
<app-footer></app-footer>
