<div class="container py-4">

   <!-- Form Card -->
   <div class="card shadow border-0 rounded-4 mx-auto"
      style="max-width: 650px;">

      <!-- Header -->
      <div class="card-header text-white text-center rounded-top-4"
         style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">

         <h2 class="mb-0 fw-bold" *ngIf="!form.data.id">
            <i class="bi bi-shield-plus me-2"></i>
            {{'Links.AddRole' | translate}}
         </h2>

         <h2 class="mb-0 fw-bold" *ngIf="form.data.id > 0">
            <i class="bi bi-pencil-square me-2"></i>
            {{'Links.UpdateRole' | translate}}
         </h2>

      </div>


      <!-- Form Body -->
      <div class="card-body p-4">


         <!-- Success Message -->
         <div class="alert alert-success text-center"
            *ngIf="!form.error && form.message">

            <i class="bi bi-check-circle me-2"></i>
            {{ form.message }}

         </div>


         <!-- Error Message -->
         <div class="alert alert-danger text-center"
            *ngIf="form.error && form.message">

            <i class="bi bi-exclamation-triangle me-2"></i>
            {{ form.message }}

         </div>


         <!-- Role Name -->
         <div class="mb-3">

            <label class="form-label fw-bold">
               {{'Name' | translate}}
               <span class="text-danger">*</span>
            </label>

            <input
               type="text"
               name="name"
               class="form-control"
               [(ngModel)]="form.data.name"
               placeholder="Enter Role Name">

            <div class="text-danger small mt-1"
               *ngIf="form.inputerror.name">

               {{ form.inputerror.name }}

            </div>

         </div>


         <!-- Description -->
         <div class="mb-4">

            <label class="form-label fw-bold">
               {{'Description' | translate}}
               <span class="text-danger">*</span>
            </label>

            <textarea
               name="description"
               class="form-control"
               [(ngModel)]="form.data.description"
               rows="4"
               placeholder="Enter Short Description"
               style="resize: none;"></textarea>

            <div class="text-danger small mt-1"
               *ngIf="form.inputerror.description">

               {{ form.inputerror.description }}

            </div>

         </div>


         <!-- Buttons -->
         <div class="text-center">

            <button
               type="button"
               class="btn btn-primary px-4 me-2"
               (click)="submit()">

               <i class="bi bi-save me-2"></i>
               {{ (isEditMode() ? 'Buttons.Update' : 'Buttons.Save') | translate }}

            </button>

            <button
               type="button"
               class="btn btn-outline-primary px-4"
               (click)="forward('/rolelist')">

               <i class="bi bi-list-ul me-2"></i>
               {{'Buttons.List' | translate}}

            </button>

         </div>

      </div>

   </div>

</div>


<!-- Footer -->
<app-footer></app-footer>
