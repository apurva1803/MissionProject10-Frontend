<div class="container py-4 py-md-5" style="max-width: 600px;">
    <div class="card border-0 shadow rounded-4 overflow-hidden">

        <!-- Header -->
        <div class="card-header text-white border-0 py-3 px-4"
            style="background: linear-gradient(135deg, #0d2137 0%, #1565c0 100%);">

            <h5 class="mb-0 fw-bold">
                <i class="bi bi-shield-lock-fill me-2"></i>
                {{'ChangePassword' | translate}}
            </h5>
        </div>

        <!-- Body -->
        <div class="card-body px-4 py-4">

            <!-- Error Message -->
            <div class="alert alert-danger py-2 mx-3 mt-3 d-flex justify-content-between align-items-center"
                *ngIf="form.error && form.message">

                <span>
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    {{form.message}}
                </span>

                <button type="button" class="btn-close" (click)="form.message=''">
                </button>

            </div>

            <!-- Success Message -->
            <div class="alert alert-success py-2 mx-3 mt-3 d-flex justify-content-between align-items-center"
                *ngIf="!form.error && form.message">

                <span>
                    <i class="bi bi-check-circle-fill me-2"></i>
                    {{form.message}}
                </span>

                <button type="button" class="btn-close" (click)="form.message=''">
                </button>

            </div>
            <!-- Old Password -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    {{'OldPassword' | translate}} <span class="text-danger">*</span>
                </label>

                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="oldPassword" [(ngModel)]="form.data.oldPassword"
                        placeholder="Enter Old Password" class="form-control" required>
                </div>

                <div class="text-danger small mt-1">
                    {{form.inputerror.oldPassword}}
                </div>
            </div>

            <!-- New Password -->
            <div class="mb-4">
                <label class="form-label fw-semibold">
                    {{'NewPassword' | translate}} <span class="text-danger">*</span>
                </label>

                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <input type="password" name="newPassword" [(ngModel)]="form.data.newPassword"
                        placeholder="Enter New Password" class="form-control" required>
                </div>

                <div class="text-danger small mt-1">
                    {{form.inputerror.newPassword}}
                </div>
            </div>

            <!-- Button -->
            <div class="d-flex justify-content-center gap-2">
                <button type="button" (click)="changePassword()" class="btn btn-primary px-4">
                    <i class="bi bi-key-fill me-1"></i>
                    {{'ChangePassword' | translate}}
                </button>
            </div>

        </div>
    </div>
</div>

<app-footer></app-footer>
